<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coffee Website | Adesola</title>

    <link rel="stylesheet" href="style.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Miniver&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        :root {
            --primary-color: #ff4b2b;
            --secondary-color: #ff416c;
            --text-color: #fff;
        }

        .section-content {
            padding: 0 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        header {
            background: var(--primary-color);
        }

        /* Navbar */
        header .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
        }

        /* Logo */
        .navbar .nav-logo {
            text-decoration: none;
        }

        .navbar .nav-logo .logo-text {
            color: var(--text-color);
            font-size: 20px;
            font-weight: 600;
        }

        /* Navigation Menu */
        .navbar .nav-menu {
            display: flex;
            align-items: center;
            gap: 10px;
            list-style: none;
        }

        .navbar .nav-menu .nav-link {
            padding: 10px 15px;
            color: var(--text-color);
            font-size: 16px;
            text-decoration: none;
            border-radius: 5px;
        }

        .navbar .nav-menu .nav-link:hover {
            color: var(--primary-color);
            background: var(--text-color);
        }

        /* Hero Section */
        .hero {
            padding: 100px 20px;
        }

        .hero-details {
            max-width: 600px;
        }

        .hero-title {
            font-size: 45px;
            margin-bottom: 20px;
        }

        .hero-description {
            font-size: 18px;
            margin-bottom: 25px;
        }

        .hero-button {
            display: inline-block;
            background: var(--primary-color);
            color: var(--text-color);
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 5px;
        }

        .hero-button:hover {
            background: var(--secondary-color);
        }
    </style>
</head>

<body>

    <header>
        <nav class="navbar section-content">

            <a href="#" class="nav-logo">
                <h2 class="logo-text">Coffee</h2>
            </a>

            <ul class="nav-menu">

                <li class="nav-item">
                    <a href="#" class="nav-link">Home</a>
                </li>

                <li class="nav-item">
                    <a href="#" class="nav-link">About</a>
                </li>

                <li class="nav-item">
                    <a href="#" class="nav-link">Menu</a>
                </li>

                <li class="nav-item">
                    <a href="#" class="nav-link">Testimonials</a>
                </li>

                <li class="nav-item">
                    <a href="#" class="nav-link">Gallery</a>
                </li>

                <li class="nav-item">
                    <a href="#" class="nav-link">Contact</a>
                </li>

            </ul>

        </nav>
    </header>

    <main>

        <section class="hero">
            <div class="section-content">

                <div class="hero-details">

                    <h1 class="hero-title">
                        Welcome to Coffee Haven
                    </h1>

                    <p class="hero-description">
                        Discover the finest coffee blends and experience
                        the perfect cup every time.
                    </p>

                    <a href="#" class="hero-button">
                        Explore Menu
                    </a>

                </div>

            </div>
        </section>

    </main>

</body>
</html>
